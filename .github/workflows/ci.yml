# Compile-only CI: catches nightly-Zig API drift (the common breakage) on a
# GPU-less runner. Linking normally needs the CUDA toolkit's stub libcuda.so,
# so we generate a stub from the exact symbol list in src/bindings.zig — if a
# binding is added, the stub picks it up automatically.
#
# What this does NOT cover: actually running kernels. `zig build run-all` on
# real hardware remains the correctness suite.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch nightly drift between commits (GitHub disables schedules in public repos after 60 days without activity; re-enable under Actions)
  workflow_dispatch:

# `shell: bash` runs every step with -eo pipefail; GitHub's implicit default
# is `bash -e` without pipefail, which would let a failing grep in a pipeline
# pass unnoticed.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zig nightly (master)
        uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Generate stub libcuda.so from bindings.zig
        run: |
          mkdir -p .ci-cuda/lib/stubs
          # Matches both `extern "cuda" fn` and library-less `extern fn`.
          grep -oP '\bextern\s+(?:"cuda"\s+)?fn\s+\K\w+' src/bindings.zig \
            | sed 's/.*/void &(void) {}/' > .ci-cuda/stub.c
          n=$(wc -l < .ci-cuda/stub.c); echo "stubbed $n driver symbols"
          test "$n" -gt 0
          zig cc -shared -fPIC -Wl,-soname,libcuda.so.1 \
            -o .ci-cuda/lib/stubs/libcuda.so .ci-cuda/stub.c

      - name: Build everything (host x86_64 + all PTX kernels)
        run: zig build -Dcuda-path="$PWD/.ci-cuda"

      # Debug host builds use Zig's self-hosted backend and linker; release
      # builds go through LLVM and LLD, the path the README's commands use.
      # Kernels are always built .fast, so they come from the cache here.
      - name: Build in release mode (LLVM + LLD host path)
        run: zig build -Dcuda-path="$PWD/.ci-cuda" -Doptimize=safe

      # Check the PTX embedded in the executables this run installed. zig-out
      # is never cached, so unlike .zig-cache (which a restored setup-zig
      # cache can fill with stale PTX variants) it holds exactly one build of
      # each kernel.
      - name: Verify PTX emission (every kernel has a .entry)
        run: |
          shopt -s nullglob
          bins=(zig-out/bin/*)
          echo "found ${#bins[@]} executables"
          test "${#bins[@]}" -eq 15
          bad=0
          for b in "${bins[@]}"; do
            grep -aqE '\.entry [A-Za-z_$][A-Za-z0-9_$]*\(' "$b" || { echo "MISSING .entry in the PTX embedded in $b (kernel was dead-code-eliminated?)"; bad=1; }
          done
          grep -aohE '\.entry [A-Za-z_$][A-Za-z0-9_$]*' "${bins[@]}" | sort -u
          exit $bad

      # A wrong name only fails at runtime (cuModuleGetFunction), which this
      # GPU-less job never reaches, so check host strings against the PTX
      # embedded in each installed executable.
      - name: Verify host getFunction names exist as PTX entries
        run: |
          bad=0; checked=0
          for d in examples/*/; do
            n=$(basename "$d")
            f="zig-out/bin/$n"
            # Drop // comments, then join lines so a call split across lines
            # (zig fmt's layout with a trailing comma) still matches; fail on
            # any call whose name was not extracted.
            src=$(sed 's|//.*||' "${d}main.zig" | tr '\n' ' ')
            calls=$({ grep -o 'getFunction(' <<<"$src" || true; } | wc -l)
            names=$(grep -oP 'getFunction\(\s*[\w.]+\s*,\s*"\K[^"]+' <<<"$src" || true)
            if [ "$(wc -w <<<"$names")" -ne "$calls" ]; then
              echo "UNCHECKED getFunction call in ${d}main.zig (name not a string literal?)"; bad=1
            fi
            for name in $names; do
              checked=$((checked+1))
              grep -aqF -- ".entry ${name}(" "$f" || { echo "MISSING entry '$name' in $f"; bad=1; }
            done
          done
          echo "checked $checked getFunction names"
          test "$checked" -gt 0 || bad=1
          exit $bad

      # Builds what a consumer actually fetches (git archive, filtered by
      # .paths) using the README's "Using as a dependency" build.zig verbatim.
      - name: Consumer smoke test (README 'Using as a dependency' snippet)
        run: |
          ws="$PWD"
          git archive --format=tar.gz --prefix=zig_cuda/ -o "$RUNNER_TEMP/zig_cuda.tar.gz" HEAD
          mkdir -p "$RUNNER_TEMP/consumer/src" && cd "$RUNNER_TEMP/consumer"
          cp "$ws/examples/01_vector_add/kernel.zig" "$ws/examples/01_vector_add/main.zig" src/
          awk '/^In your `build.zig`:/{f=1} f&&/^```zig$/{p=1;next} p&&/^```$/{exit} p' "$ws/README.md" > build.zig
          test -s build.zig
          zig fetch --save=cuda "$RUNNER_TEMP/zig_cuda.tar.gz"
          zig build -Dcuda-path="$ws/.ci-cuda"
          # `zig build` succeeds without compiling anything if the snippet
          # stops installing the exe, so require that one was installed.
          test -n "$(find zig-out/bin -type f 2>/dev/null)" || { echo "::error::README snippet installed no executable"; exit 1; }
